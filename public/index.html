<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>QuranKu Pro - Al-Quran Digital</title>
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22QuranKu%20Pro%22%2C%22short_name%22%3A%22QuranKu%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23000000%22%2C%22theme_color%22%3A%22%23000000%22%7D">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ========== RESET ========== */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#000;--surface:#121212;--surface2:#1e1e1e;--surface3:#2a2a2a;
  --text:#fff;--text2:#a0a0a0;--text3:#6b6b6b;--accent:#4ade80;--accent2:#22c55e;
  --danger:#ef4444;--warning:#f59e0b;--info:#38bdf8;--border:#2a2a2a;
  --nav-w:480px;--radius:16px;--shadow:0 8px 32px rgba(0,0,0,.4)
}
[data-theme="light"]{
  --bg:#f5f5f5;--surface:#fff;--surface2:#f0f0f0;--surface3:#e5e5e5;
  --text:#111;--text2:#555;--text3:#888;--border:#ddd;
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
#app{max-width:var(--nav-w);margin:0 auto;min-height:100vh;position:relative;padding-bottom:140px}
.hidden{display:none!important}

/* ========== HEADER ========== */
.page-header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;position:sticky;top:0;background:rgba(0,0,0,.92);backdrop-filter:blur(12px);z-index:90;border-bottom:1px solid var(--border)}
[data-theme="light"] .page-header{background:rgba(255,255,255,.92)}
.page-header h1{font-size:22px;font-weight:800;letter-spacing:-.5px}
.premium-btn{background:linear-gradient(135deg,#f59e0b,#fbbf24);border:none;color:#000;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(245,158,11,.3)}
.premium-btn:hover{transform:scale(1.03)}
.header-icon{width:38px;height:38px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--border)}
.header-icon svg{width:18px;height:18px;fill:var(--text)}

/* ========== BOTTOM NAV ========== */
.bottom-nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:calc(100% - 20px);max-width:var(--nav-w);background:rgba(18,18,18,.96);backdrop-filter:blur(20px);border-radius:28px;display:flex;justify-content:space-evenly;padding:6px 4px;z-index:100;border:1px solid var(--border);box-shadow:0 10px 30px rgba(0,0,0,.5)}
[data-theme="light"] .bottom-nav{background:rgba(255,255,255,.96)}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text3);cursor:pointer;padding:6px 10px;border-radius:16px;background:none;border:none;font-size:10px;font-weight:600;flex:1;transition:all .2s}
.nav-item svg{width:22px;height:22px;fill:currentColor}
.nav-item.active{color:var(--accent)}
.nav-item.active .icon-wrap{background:rgba(74,222,128,.15);border-radius:14px}
.nav-item .icon-wrap{display:flex;align-items:center;justify-content:center;width:42px;height:32px;border-radius:14px;transition:background .2s}

/* ========== MINI PLAYER ========== */
.mini-player{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);width:calc(100% - 20px);max-width:var(--nav-w);background:rgba(18,18,18,.96);backdrop-filter:blur(20px);border-radius:18px;padding:8px;display:flex;align-items:center;gap:10px;z-index:95;border:1px solid var(--border);cursor:pointer;box-shadow:var(--shadow)}
[data-theme="light"] .mini-player{background:rgba(255,255,255,.96)}
.mini-avatar{width:46px;height:46px;border-radius:12px;object-fit:cover;background:var(--surface3);flex-shrink:0}
.mini-info{flex:1;min-width:0;cursor:pointer}
.mini-title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-subtitle{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.mini-controls{display:flex;gap:2px;align-items:center}
.mini-controls button{background:none;border:none;color:var(--text);cursor:pointer;padding:4px;display:flex;align-items:center}
.mini-controls svg{width:18px;height:18px;fill:currentColor}
.mini-controls button:first-child{color:var(--accent)}

/* ========== SECTION ========== */
.section-title{font-size:19px;font-weight:800;margin:24px 16px 12px;display:flex;justify-content:space-between;align-items:center;letter-spacing:-.3px}
.section-title .see-all{font-size:13px;color:var(--accent);cursor:pointer;font-weight:600;text-transform:none}
.section-title .see-all:hover{text-decoration:underline}
.h-scroll{display:flex;gap:12px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none}
.h-scroll::-webkit-scrollbar{display:none}

/* ========== RECITER CIRCLE ========== */
.reciter-circle{display:flex;flex-direction:column;align-items:center;cursor:pointer;min-width:70px;text-align:center}
.reciter-circle img{width:68px;height:68px;border-radius:50%;object-fit:cover;margin-bottom:8px;border:2px solid var(--border);transition:all .2s}
.reciter-circle:hover img{border-color:var(--accent);transform:scale(1.06)}
.reciter-circle .name{font-size:11px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.reciter-circle.active img{border-color:var(--accent);box-shadow:0 0 0 3px rgba(74,222,128,.2)}

/* ========== PLAYLIST CARD ========== */
.playlist-card{min-width:150px;height:175px;border-radius:var(--radius);position:relative;overflow:hidden;cursor:pointer;transition:transform .2s;flex-shrink:0}
.playlist-card:hover{transform:scale(1.02)}
.playlist-card .bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.55)}
.playlist-card:hover .bg{filter:brightness(.4)}
.playlist-card .content{position:absolute;bottom:0;left:0;right:0;padding:12px;background:linear-gradient(transparent,rgba(0,0,0,.85))}
.playlist-card .title{font-size:14px;font-weight:700;margin-top:4px}
.playlist-card .subtitle{font-size:10px;color:var(--text3)}
.playlist-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 16px}
.playlist-grid .playlist-card{min-width:0;width:100%;height:190px;margin:0}

/* ========== SETTINGS ========== */
.settings-section{padding:14px 16px}
.settings-label{font-size:12px;color:var(--text3);margin-bottom:8px;padding-left:4px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.settings-group{background:var(--surface);border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}
.settings-item{display:flex;align-items:center;padding:14px;gap:10px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .2s}
.settings-item:last-child{border-bottom:none}
.settings-item:hover{background:var(--surface2)}
.settings-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--surface3)}
.stitle{font-size:14px;font-weight:600}
.sdesc{font-size:11px;color:var(--text3);margin-top:2px}
.settings-arrow{color:var(--text3);font-size:16px;margin-left:auto}
.switch{width:40px;height:24px;background:var(--surface3);border-radius:20px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.switch::after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;background:var(--text3);border-radius:50%;transition:transform .2s,background .2s}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(16px);background:#fff}

/* ========== SEARCH ========== */
.search-page{padding:20px 16px}
.search-header h1{font-size:32px;font-weight:800;margin-bottom:16px;letter-spacing:-1px}
.search-bar{background:var(--surface);border-radius:24px;padding:12px 16px;display:flex;align-items:center;gap:10px;border:1px solid var(--border);margin-bottom:20px}
.search-bar svg{width:18px;height:18px;fill:var(--text3)}
.search-bar input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px}
.search-bar input::placeholder{color:var(--text3)}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:16px;scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}
.chip{background:var(--surface);border:1px solid var(--border);color:var(--text2);padding:8px 14px;border-radius:20px;font-size:12px;cursor:pointer;white-space:nowrap;transition:all .2s}
.chip.active{background:var(--accent);border-color:var(--accent);color:#000}
.chip:hover{border-color:var(--accent)}

/* ========== INSIGHTS ========== */
.insights-card{margin:0 16px;background:var(--surface);border-radius:20px;padding:18px;border:1px solid var(--border)}
.insights-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat-box{text-align:center;padding:12px 6px;background:var(--surface2);border-radius:12px}
.stat-box .label{font-size:10px;color:var(--text3);margin-bottom:4px}
.stat-box .value{font-size:18px;font-weight:800}
.today-card{text-align:center;background:var(--surface2);border-radius:14px;padding:16px;margin-bottom:12px}
.today-card .time{font-size:38px;font-weight:800;letter-spacing:-1px}
.today-card .goal{font-size:12px;color:var(--text3);margin-top:4px}
.week-days{display:flex;justify-content:space-between;margin-top:12px;padding:0 4px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px}
.day .circle{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px}
.day.active .circle{background:var(--accent);border-color:var(--accent)}
.day.active .label{color:var(--accent)}
.day .label{font-size:10px;color:var(--text3)}

/* ========== RECENTLY ========== */
.recently-section{margin:0 16px;background:linear-gradient(135deg,var(--surface),var(--surface2));border-radius:20px;padding:16px;display:flex;align-items:center;gap:14px;border:1px solid var(--border)}
.recently-section img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid var(--accent)}
.recently-info{flex:1}
.rlabel{font-size:11px;color:var(--text3)}
.rname{font-size:15px;font-weight:700;margin:4px 0 8px}
.continue-btn{background:var(--accent);color:#000;border:none;padding:8px 14px;border-radius:18px;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px}
.continue-btn:hover{opacity:.9}

/* ========== SURAH LIST ========== */
.surah-list{padding:0 16px;display:flex;flex-direction:column;gap:8px}
.surah-card{display:flex;align-items:center;background:var(--surface);border-radius:14px;padding:12px 14px;cursor:pointer;border:1px solid var(--border);transition:all .15s}
.surah-card:hover{border-color:var(--accent);transform:translateX(4px)}
.surah-num{width:36px;height:36px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:800;margin-right:14px;font-size:14px}
.surah-info{flex:1}
.surah-name{font-weight:700;font-size:14px}
.surah-meta{font-size:11px;color:var(--text3);margin-top:1px}
.surah-arrow{color:var(--text3)}

/* ========== AYAT CARD ========== */
.ayat-card{background:var(--surface);border-radius:16px;padding:16px;margin:0 16px 14px;border:1px solid var(--border);position:relative;transition:border .2s}
.ayat-card:hover{border-color:var(--accent)}
.ayat-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ayat-num{background:var(--accent);color:#000;padding:4px 10px;border-radius:14px;font-size:12px;font-weight:700}
.ayat-actions{display:flex;gap:4px}
.mini-btn{background:var(--surface2);border:none;cursor:pointer;padding:5px 10px;border-radius:14px;font-size:11px;display:flex;align-items:center;gap:4px;color:var(--text);transition:all .2s}
.mini-btn:hover,.mini-btn.active{background:var(--accent);color:#000}
.arabic{font-family:'Scheherazade New','Amiri',serif;font-size:var(--arab-size,26px);line-height:2.1;text-align:right;direction:rtl;margin:8px 0}
.latin-text{font-size:13px;color:var(--text3);font-style:italic;margin-bottom:8px;line-height:1.6}
.translation{font-size:14px;line-height:1.7;color:var(--text2);border-top:1px dashed var(--border);padding-top:10px;margin-top:6px}
.hafalan-mode .arabic{filter:blur(8px)}
.hafalan-mode .arabic:hover{filter:none}

/* ========== PLAYER OVERLAY ========== */
.player-overlay{position:fixed;inset:0;background:linear-gradient(180deg,#000 0%,#0a0a0a 50%,#111 100%);z-index:200;display:flex;flex-direction:column;padding:20px;transform:translateY(100%);transition:transform .4s cubic-bezier(.4,0,.2,1)}
.player-overlay.open{transform:translateY(0)}
.player-header{display:flex;align-items:center;justify-content:space-between;padding:8px}
.player-header button{background:var(--surface);border:none;color:var(--text);width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:18px}
.player-header button:last-child{font-size:20px}
.player-bg-select{background:rgba(255,255,255,.1);border:none;color:var(--text);padding:8px 16px;border-radius:20px;font-size:12px;cursor:pointer;outline:none}
.player-bg-select option{background:#111;color:#fff}
.player-qari{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px}
.player-qari img{width:200px;height:200px;border-radius:50%;object-fit:cover;box-shadow:0 12px 40px rgba(0,0,0,.6);border:3px solid var(--accent)}
.player-info{text-align:center}
.player-info h2{font-size:22px;font-weight:800}
.player-info p{font-size:13px;color:var(--text3);margin-top:4px}
.player-controls{display:flex;align-items:center;justify-content:center;gap:28px;margin:16px 0}
.player-controls button{background:none;border:none;color:var(--text);cursor:pointer}
.player-controls .play-btn{width:68px;height:68px;background:var(--accent);color:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(74,222,128,.4)}
.player-controls .play-btn svg{width:30px;height:30px;fill:currentColor}
.player-controls button:not(.play-btn) svg{width:24px;height:24px;fill:currentColor}
.player-progress{padding:0 20px;margin-top:8px}
.progress-bar{width:100%;height:5px;background:rgba(255,255,255,.15);border-radius:5px;position:relative;cursor:pointer}
.progress-fill{height:100%;background:var(--accent);border-radius:5px;width:0%}
.progress-times{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--text3)}
.player-bottom{display:flex;justify-content:space-between;align-items:center;padding:16px 20px}
.player-bottom button{background:none;border:none;color:var(--text);font-size:20px;cursor:pointer}

/* ========== BOOKMARK LIST ========== */
.bookmark-card{display:flex;align-items:center;background:var(--surface);border-radius:14px;padding:14px;margin:0 16px 10px;border:1px solid var(--border);cursor:pointer}
.bookmark-card:hover{border-color:var(--accent)}
.bookmark-card img{width:44px;height:44px;border-radius:10px;margin-right:12px;object-fit:cover}
.bookmark-info{flex:1}
.bookmark-title{font-weight:700;font-size:14px}
.bookmark-sub{font-size:11px;color:var(--text3);margin-top:2px}

/* ========== TOAST ========== */
.toast{position:fixed;bottom:160px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface);border:1px solid var(--accent);color:var(--text);padding:12px 20px;border-radius:12px;font-size:13px;z-index:300;opacity:0;transition:all .3s;pointer-events:none;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ========== LOADING ========== */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px;gap:12px}
.spinner{width:42px;height:42px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:var(--text3);font-size:13px}

/* ========== RESPONSIVE ========== */
@media(max-width:480px){
  .bottom-nav{width:calc(100% - 16px);bottom:8px;padding:4px;}
  .mini-player{bottom:76px;width:calc(100% - 16px)}
  .player-qari img{width:170px;height:170px}
  .page-header{padding:12px 14px}
}
</style>
</head>
<body data-theme="dark">

<div id="app">
  <header class="page-header" id="pageHeader"></header>
  <div id="content"></div>
</div>

<!-- Mini Player -->
<div class="mini-player" id="miniPlayer">

</div>

<!-- Bottom Navigation -->
<nav class="bottom-nav" id="bottomNav"></nav>

<div class="player-overlay" id="playerOverlay">

  </div>
  <div class="player-progress">
    <div class="progress-bar" onclick="seek(event)"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-times"><span id="curTime">00:00</span><span id="durTime">-00:00</span></div>
  </div>
  <div class="player-bottom">
    <button>🔊</button>
    <button>🕋</button>
    <button>📡</button>

</div>

<div class="toast" id="toast"></div>

/* ==================================================
   DATA KONSTAN

const API_BASE = 'https://equran.id/api/v2';

const RECITERS = [

  { id:'ahmed', name:'Ahmed Kaseb', country:'Egypt', image:'https://ui-avatars.com/api/?name=Ahmed+Kaseb&background=DC2626&color=fff&size=128', murottal:'ar.ahmedkaseb', isNew:false },
  { id:'omar', name:'Omar Bn DiaaAldeen', country:'Kazakhstan', image:'https://ui-avatars.com/api/?name=Omar+Bn&background=111827&color=fff&size=128', murottal:'ar.omaralqazabri', isNew:false },
  { id:'yassin', name:'Yassin Al-Jazairi', country:'Algeria', image:'https://ui-avatars.com/api/?name=Yassin&background=7C3AED&color=fff&size=128', murottal:'ar.yassinaljazaeri', isNew:true },
  { id:'maher', name:'Maher Al-Muaiqly', country:'Saudi Arabia', image:'https://ui-avatars.com/api/?name=Maher&background=059669&color=fff&size=128', murottal:'ar.mahermuaiqly', isNew:true },

/* ==================================================

================================================== */
let state = {
  tab: 'home',
  theme: localStorage.getItem('qk_theme') || 'dark',
  view: 'home', // home, reciters, playlists, search, settings, surah-list, surah-detail, reciter-detail, playlist-detail, bookmarks, insights
  viewParams: null,
  user: {
    streak: 0, weeklyMinutes: 0, totalMinutes: 0, todaySeconds: 0,
    bookmarks: [], recentlyPlayed: [], favourites: ['mishary','abdurrahman']
  },
  surahList: [],
  nowPlaying: null,
  isPlaying: false,
  audio: null,
  speed: 1,
  arabicFontSize: parseInt(localStorage.getItem('qk_arab_size') || '26'),
  showTranslation: true,
  showLatin: true,
  hafalanMode: false,
  playHistory: []
};

const $ = sel => document.querySelector(sel);
const $$ = sel => document.querySelectorAll(sel);

function saveUser() {
  localStorage.setItem('qk_user', JSON.stringify(state.user));
}
function loadUser() {
  const saved = localStorage.getItem('qk_user');
  if (saved) state.user = JSON.parse(saved);
}
function applyTheme() {
  document.body.setAttribute('data-theme', state.theme);
  localStorage.setItem('qk_theme', state.theme);
  document.documentElement.style.setProperty('--arab-size', state.arabicFontSize + 'px');
  localStorage.setItem('qk_arab_size', String(state.arabicFontSize));
}

function showToast(msg) {
  const toast = $('#toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

function formatTime(sec) {
  if (!sec || isNaN(sec)) return '00:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

/* ==================================================
   API CALLS
================================================== */
async function fetchSurahList() {
  if (state.surahList.length) return state.surahList;
  const res = await fetch(`${API_BASE}/surat`);
  const json = await res.json();
  state.surahList = json.data || [];
  return state.surahList;
}

async function fetchSurahDetail(nomor) {
  const res = await fetch(`${API_BASE}/surat/${nomor}`);
  const json = await res.json();
  return json.data;
}

function getAudioUrl(surahNum, murottalId) {
  return `https://cdn.islamic.network/quran/audio/128/${murottalId}/${surahNum}.mp3`;
}

/* ==================================================
   NAVIGATION
================================================== */
function navigate(view, params) {
  state.view = view;
  state.viewParams = params || null;
  renderAll();
  if (view === 'home') state.tab = 'home';
  if (view === 'reciters') state.tab = 'reciters';
  if (view === 'playlists') state.tab = 'playlists';
  if (view === 'search') state.tab = 'search';
  if (view === 'settings') state.tab = 'settings';
}

function goBack() {
  if (state.view === 'reciter-detail' || state.view === 'playlist-detail') navigate('reciters');
  else if (state.view === 'surah-detail') navigate('surah-list');
  else if (state.view === 'insights') navigate('home');
  else navigate('home');
}

function playFromPlaylist(playlistId, surahNum) {

let searchCategory = 'all';

function setSearchCat(btn, cat) {
  searchCategory = cat;
  $$('.chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  const input = $('#searchInput');
  if (input) handleSearch(input.value);
}

function handleSearch(q) {
  const results = $('#searchResults');
  const ql = q.trim().toLowerCase();
  
  if (!ql || ql.length < 2) {
    results.innerHTML = `
      <div style="text-align:center;padding:40px;color:var(--text3);">
        <div style="font-size:40px;margin-bottom:10px;">🔍</div>
        <div>Ketik minimal 2 huruf</div>
      </div>`;
    return;
  }

  const matchedRecs = searchCategory === 'playlists' ? [] : RECITERS.filter(r => r.name.toLowerCase().includes(ql) || r.country.toLowerCase().includes(ql));
  const matchedSurahs = searchCategory === 'reciters' ? [] : state.surahList.filter(s => s.namaLatin.toLowerCase().includes(ql) || s.arti.toLowerCase().includes(ql) || String(s.nomor).includes(ql));
  const matchedPlays = searchCategory === 'surahs' ? [] : PLAYLISTS.filter(p => p.title.toLowerCase().includes(ql) || p.desc.toLowerCase().includes(ql));

  let html = '';
  if (searchCategory !== 'surahs' && matchedRecs.length) {
    html += `<div class="section-title" style="margin:16px 0 8px;">Reciters</div><div class="h-scroll" style="padding:0;">`;
    html += matchedRecs.map(r => `
      <div class="reciter-circle" onclick="openReciterDetail('${r.id}')">
        <img src="${r.image}"><div class="name">${r.name}</div>
      </div>
    `).join('');
    html += `</div>`;
  }
  if (searchCategory !== 'playlists' && matchedSurahs.length) {
    html += `<div class="section-title" style="margin:16px 0 8px;">Surahs</div><div class="surah-list">`;
    html += matchedSurahs.slice(0, 10).map(s => `
      <div class="surah-card" onclick="openSurahDetail(${s.nomor})">
        <div class="surah-num">${s.nomor}</div>
        <div class="surah-info"><div class="surah-name">${s.namaLatin}</div><div class="surah-meta">${s.arti}</div></div>
        <div class="surah-arrow">›</div>
      </div>
    `).join('');
    html += `</div>`;
  }
  if (searchCategory !== 'reciters' && matchedPlays.length) {
    html += `<div class="section-title" style="margin:16px 0 8px;">Playlists</div><div class="h-scroll" style="padding:0;">`;
    html += matchedPlays.map(p => `
      <div class="playlist-card" onclick="openPlaylistDetail('${p.id}')">
        <div class="bg" style="background-image:url('${p.image}')"></div>
        <div class="content"><div class="title">${p.title}</div></div>
      </div>
    `).join('');
    html += `</div>`;
  }
  if (!html) html = '<div style="text-align:center;padding:40px;color:var(--text3);">Tidak ditemukan</div>';
  results.innerHTML = html;
}

/* ==================================================
   PLAYER LOGIC
================================================== */
function playSurahFromReciter(reciterId, surahNum) {
  const reciter = RECITERS.find(r => r.id === reciterId) || RECITERS[0];
  const surahName = state.surahList.find(s => s.nomor === surahNum)?.namaLatin || `Surah ${surahNum}`;
  const audioUrl = getAudioUrl(surahNum, reciter.murottal);

  state.nowPlaying = {
    surah: surahNum,
    surahName,
    reciterId: reciter.id,
    reciterName: reciter.name,
    image: reciter.image,
    audioUrl
  };

  // Update mini player
  $('#miniAvatar').src = reciter.image;
  $('#miniTitle').textContent = surahName;
  $('#miniSubtitle').textContent = reciter.name;
  $('#playerTitle').textContent = surahName;
  $('#playerSubtitle').textContent = reciter.name;
  $('#playerAvatar').src = reciter.image;

  // Recent activity
  if (state.user.recentlyPlayed[0] !== reciter.id) {
    state.user.recentlyPlayed.unshift(reciter.id);
    state.user.recentlyPlayed = state.user.recentlyPlayed.slice(0, 5);
  }
  state.user.totalMinutes += 1;
  state.user.weeklyMinutes += 1;
  state.user.streak += 1;
  state.user.todaySeconds += 60;
  saveUser();

  openPlayer();
  play();
}

function openPlayer() {
  if (!state.nowPlaying) {
    // Default
    playSurahFromReciter('mishary', 18);
    return;
  }
  $('#playerOverlay').classList.add('open');
}

function closePlayer() {
  $('#playerOverlay').classList.remove('open');
}

function play() {
  if (!state.nowPlaying) return;
  if (!state.audio) {
    state.audio = new Audio(state.nowPlaying.audioUrl);
    state.audio.playbackRate = state.speed;
    state.audio.addEventListener('timeupdate', updateProgress);
    state.audio.addEventListener('ended', () => {
      state.isPlaying = false;
      updatePlayIcons();
    });
  }
  state.audio.play();
  state.isPlaying = true;
  updatePlayIcons();
}

function togglePlay() {
  if (!state.nowPlaying) return;
  if (!state.audio) { play(); return; }
  if (state.isPlaying) {
    state.audio.pause();
    state.isPlaying = false;
  } else {
    state.audio.play();
    state.isPlaying = true;
  }
  updatePlayIcons();
}

function nextTrack() {
  if (!state.nowPlaying) return;
  const nextSurah = state.nowPlaying.surah < 114 ? state.nowPlaying.surah + 1 : 1;
  playSurahFromReciter(state.nowPlaying.reciterId, nextSurah);
}

function prevTrack() {
  if (!state.nowPlaying) return;
  const prevSurah = state.nowPlaying.surah > 1 ? state.nowPlaying.surah - 1 : 114;
  playSurahFromReciter(state.nowPlaying.reciterId, prevSurah);
}

function setSpeed() {
  state.speed = state.speed === 1 ? 1.5 : state.speed === 1.5 ? 2 : 1;
  $('#speedLabel').textContent = state.speed + 'x';
  if (state.audio) state.audio.playbackRate = state.speed;
  showToast('Kecepatan: ' + state.speed + 'x');
}

function seek(e) {
  if (!state.audio) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  state.audio.currentTime = pct * state.audio.duration;
}

function updateProgress() {
  if (!state.audio) return;
  const pct = (state.audio.currentTime / state.audio.duration) * 100;
  $('#progressFill').style.width = pct + '%';
  $('#curTime').textContent = formatTime(state.audio.currentTime);
  $('#durTime').textContent = '-' + formatTime(state.audio.duration - state.audio.currentTime);
}

function updatePlayIcons() {
  const path = state.isPlaying ? 'M6 5h4v14H6zm8 0h4v14h-4z' : 'M8 5v14l11-7z';
  $('#playIcon').innerHTML = `<path d="${path}"/>`;
  $('#miniPlayIcon').innerHTML = `<path d="${path}"/>`;
}

/* ==================================================
   INIT
================================================== */
async function init() {
  loadUser();
  applyTheme();
  try {
    // Preload surah list
    await fetchSurahList();
  } catch(e) {
    console.warn('Gagal memuat surah list');
  }
  navigate('home');
}

init();
</script>
